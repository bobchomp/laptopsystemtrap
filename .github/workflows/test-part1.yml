# End-to-end test of parts 1 and 2 on a real Windows machine:
# Part 1: Enable-Auditing -> strip a test folder's permissions with icacls ->
#         Get-PermissionReport must catch it.
# Part 2: Install-RepairTask -> strip folders -> the SYSTEM task must repair them,
#         on demand and from the audit event -> Uninstall-RepairTask.
# Weekly: Install-WeeklyCheck (test mode: emails written to files, not sent) ->
#         weekly / logon / streak / problems runs of the task -> Uninstall-WeeklyCheck.
# Finally Disable-Auditing must restore everything.
# The runner is elevated, so the scripts run as they would from an admin prompt.
name: Test parts 1 and 2 + weekly check

on:
  push:
    paths:
      - '*.ps1'
      - 'tests/**'
      - '.github/workflows/test-part1.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-part1:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1, same as on the laptop

    steps:
      - uses: actions/checkout@v4

      - name: Prepare and record settings before the test
        run: |
          . .\tests\TestHelpers.ps1
          if (-not (Test-Path -LiteralPath $PackagesPath)) {
              New-Item -ItemType Directory -Path $PackagesPath | Out-Null
              Write-Host "Created $PackagesPath (runner did not have it)"
          }
          if (Test-Path -LiteralPath $StateDir) { throw "$StateDir already exists - runner is not clean" }
          $before = Get-AuditSnapshot
          $before | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $BeforeFile -Encoding UTF8
          Write-Host "User: $([System.Security.Principal.WindowsIdentity]::GetCurrent().Name)"
          Write-Host "Before:"; Get-Content -LiteralPath $BeforeFile

      - name: 1. Enable-Auditing.ps1
        id: enable
        run: |
          . .\tests\TestHelpers.ps1
          & .\Enable-Auditing.ps1 *>&1 | Tee-Object -FilePath (Join-Path $ArtifactDir 'enable-output.txt')
          $out   = Get-Content -LiteralPath (Join-Path $ArtifactDir 'enable-output.txt')
          $after = Get-AuditSnapshot

          foreach ($name in $Subcategories.Keys) {
              $setting = $after.AuditSettings.($Subcategories[$name])
              Assert-True ($setting -match 'Success') "$name auditing is '$setting' (expected Success)"
          }
          Assert-True $after.HasAuditRule 'Audit rule (Everyone, ChangePermissions+TakeOwnership, Success) is on the Packages folder'
          Assert-True ($after.CmdLineValue -eq 1) "ProcessCreationIncludeCmdLine_Enabled is '$($after.CmdLineValue)' (expected 1)"
          Assert-True ($after.SecurityLogMax -ge 134217728) "Security log max size is $($after.SecurityLogMax) (expected >= 128 MB)"
          Assert-True (Test-Path -LiteralPath (Join-Path $StateDir 'audit-state.json')) 'audit-state.json was written'
          Assert-True (Test-Path -LiteralPath (Join-Path $StateDir 'auditpol-backup.csv')) 'auditpol-backup.csv was written'
          Assert-True (-not ($out -match '\bWARN\b')) 'Enable-Auditing.ps1 printed no warnings (DACL unchanged etc.)'
          Complete-Assertions

      - name: 2. Strip the test folder to current-user-only
        run: |
          . .\tests\TestHelpers.ps1
          # icacls runs from this powershell.exe, so the report should show it as the parent.
          New-StrippedTestFolder $TestFolder
          $PID | Set-Content -LiteralPath (Join-Path $ArtifactDir 'icacls-parent-pid.txt')
          Start-Sleep -Seconds 5   # let the events reach the Security log

      - name: 3. Get-PermissionReport.ps1
        run: |
          . .\tests\TestHelpers.ps1
          & .\Get-PermissionReport.ps1 *>&1 | Tee-Object -FilePath (Join-Path $ArtifactDir 'report-console.txt')

          $report = Get-ChildItem -LiteralPath (Join-Path $StateDir 'reports') -Filter 'PermissionReport_*.txt' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime | Select-Object -Last 1
          Assert-True $report 'Report file was saved'
          if (-not $report) { Complete-Assertions }
          $lines = @(Get-Content -LiteralPath $report.FullName)

          # Which audit events actually fired for the test folder (the spec asks to verify 4670 vs 4663).
          $ids = @(Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 4670, 4663 } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -like "*PermissionTrap.TestFolder*" } | Group-Object Id |
              ForEach-Object { "$($_.Name) x$($_.Count)" })
          Write-Host "::notice::Events for the test folder: $(if ($ids) { $ids -join ', ' } else { 'none' })"

          # The test folder must be listed under "Missing SYSTEM:" (section ends at the next blank line).
          $start = [array]::IndexOf($lines, 'Missing SYSTEM:')
          $missing = @()
          if ($start -ge 0) {
              for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i].Trim(); $i++) { $missing += $lines[$i].Trim() }
          }
          Assert-True ($missing -match '^PermissionTrap\.TestFolder\b') 'Report lists PermissionTrap.TestFolder as missing SYSTEM'

          # Find the process chain that starts with icacls.exe and check its parent (the next "^ " line).
          $parentLine = $null
          for ($i = 0; $i -lt $lines.Count -and -not $parentLine; $i++) {
              if ($lines[$i] -notmatch '^    [^ ^].*\bicacls\.exe  \(PID \d+') { continue }
              for ($j = $i + 1; $j -lt $lines.Count; $j++) {
                  if ($lines[$j] -match '^\s+\^ ') { $parentLine = $lines[$j]; break }
                  if ($lines[$j] -match '^-{10,}|^\S') { break }   # next burst or section
              }
          }
          Assert-True ($lines -match '^    [^ ^].*\bicacls\.exe  \(PID \d+') 'Report has a process chain starting with icacls.exe'
          Assert-True ($parentLine -match '\\(powershell|pwsh)\.exe  \(PID') "icacls.exe's parent is powershell.exe/pwsh.exe (got: '$parentLine')"

          $expectedPid = (Get-Content -LiteralPath (Join-Path $ArtifactDir 'icacls-parent-pid.txt')).Trim()
          Assert-True ($parentLine -match "\(PID $expectedPid,") "Parent PID matches the powershell.exe that ran icacls ($expectedPid)"

          # The headline must name a real program, not the boot process at the very top of every chain.
          $headline = @($lines -match '>>> WHAT DID IT: ') | Select-Object -First 1
          Assert-True ($headline -and $headline -notmatch '\\(smss|wininit|services|svchost)\.exe ') "Headline names a program, not a Windows launcher (got: '$headline')"

          if (-not ($lines -match 'Result: .*removed SYSTEM')) {
              Write-Host '::warning::Report did not say "removed SYSTEM" (only seen when event 4670 fires with old/new SDDL)'
          }
          Complete-Assertions

      - name: 4. Install-RepairTask.ps1
        id: install
        if: ${{ !cancelled() && steps.enable.conclusion == 'success' }}
        run: |
          . .\tests\TestHelpers.ps1
          & .\Install-RepairTask.ps1 -WithAuditTrigger *>&1 | Tee-Object -FilePath (Join-Path $ArtifactDir 'install-repair-output.txt')
          $out  = Get-Content -LiteralPath (Join-Path $ArtifactDir 'install-repair-output.txt')
          $task = Get-ScheduledTask -TaskName $RepairTask -ErrorAction SilentlyContinue
          Assert-True $task "Scheduled task '$RepairTask' is registered"
          if (-not $task) { Complete-Assertions }
          Export-ScheduledTask -TaskName $RepairTask | Set-Content -LiteralPath (Join-Path $ArtifactDir 'repair-task.xml')

          Assert-True ($task.Principal.UserId -in 'SYSTEM', 'S-1-5-18', 'NT AUTHORITY\SYSTEM') "Task runs as SYSTEM (got '$($task.Principal.UserId)')"
          Assert-True ($task.Principal.RunLevel -eq 'Highest') "Task runs with highest privileges (got '$($task.Principal.RunLevel)')"
          Assert-True ($task.Settings.MultipleInstances -eq 'IgnoreNew') "One instance at a time (got '$($task.Settings.MultipleInstances)')"
          $types = @($task.Triggers | ForEach-Object { $_.CimClass.CimClassName })
          Assert-True ($types -contains 'MSFT_TaskLogonTrigger') "Has a logon trigger (got: $($types -join ', '))"
          $evt = $task.Triggers | Where-Object { $_.CimClass.CimClassName -eq 'MSFT_TaskEventTrigger' }
          Assert-True ($evt -and $evt.Subscription -match 'EventID=4670') 'Has the audit-event (4670) trigger'
          Assert-True ($task.Actions[0].Arguments -like "*$PackagesPath*") "Task has this user's Packages path built in (SYSTEM's %LOCALAPPDATA% differs)"

          # The task runs as SYSTEM, so ordinary users must not be able to change the script it runs.
          $script = Join-Path $StateDir 'Repair-Permissions.ps1'
          Assert-True (Test-Path -LiteralPath $script) 'Repair script copied to C:\ProgramData\PermissionTrap'
          $writers = Get-OtherAccess $script $WriteRights 'S-1-5-18', 'S-1-5-32-544'
          Assert-True ($writers.Count -eq 0) "Only SYSTEM and Administrators can change the repair script (others: $($writers -join '; '))"
          Assert-True (-not ($out -match '\bWARN\b')) 'Install-RepairTask.ps1 printed no warnings'
          Complete-Assertions

      - name: 5. Repair on demand (Start-ScheduledTask)
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: |
          . .\tests\TestHelpers.ps1
          New-StrippedTestFolder $RepairFolderA
          Start-ScheduledTask -TaskName $RepairTask
          $ok = Wait-Until 120 { (Test-HasSid $RepairFolderA 'S-1-5-18') -and (Test-Path -LiteralPath $RepairLog) -and
                                 (Select-String -LiteralPath $RepairLog -Pattern 'FIXED\s+PermissionTrap\.RepairTestA\s' -Quiet) }
          Write-Host "Repaired within 120 s: $ok"; Write-Host 'After repair:'; & icacls.exe $RepairFolderA
          Assert-Repaired $RepairFolderA

          # Let the run finish (it re-checks 30 s after a fix) and check it succeeded.
          Assert-True (Wait-RepairTaskIdle) 'Task run finished'
          $result = (Get-ScheduledTaskInfo -TaskName $RepairTask).LastTaskResult
          Assert-True ($result -eq 0) "Task run exit code is 0 (got $result)"
          Complete-Assertions

      - name: 6. Repair from the audit event (no manual start)
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: |
          . .\tests\TestHelpers.ps1
          # Step 5's own repair logs a permission change too, which starts the task
          # again 30 s later. Let that leftover run fire and finish first, or it can
          # repair this folder and hide whether this folder's own trigger works.
          Wait-Until 120 { (Get-ScheduledTask -TaskName $RepairTask).State -ne 'Running' -and
                           ((Get-Date) - (Get-Item -LiteralPath $RepairLog).LastWriteTime).TotalSeconds -gt 45 } | Out-Null
          Wait-RepairTaskIdle | Out-Null   # a running instance would make the scheduler skip this trigger
          New-StrippedTestFolder $RepairFolderB
          $stripped = Get-Date
          # The trigger waits 30 s after the event, then the repair runs.
          $ok = Wait-Until 180 { (Test-HasSid $RepairFolderB 'S-1-5-18') -and (Test-Path -LiteralPath $RepairLog) -and
                                 (Select-String -LiteralPath $RepairLog -Pattern 'FIXED\s+PermissionTrap\.RepairTestB\s' -Quiet) }
          $after = ((Get-Date) - $stripped).TotalSeconds
          Write-Host ("Repaired by the event trigger within 180 s: $ok, after {0:N0} s" -f $after); & icacls.exe $RepairFolderB
          Assert-True ($after -ge 25) ("Repair came from this folder's own delayed event trigger (after {0:N0} s; the trigger waits 30 s)" -f $after)
          Assert-Repaired $RepairFolderB
          Complete-Assertions

      - name: 7. Uninstall-RepairTask.ps1
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: |
          . .\tests\TestHelpers.ps1
          Copy-Item -LiteralPath $RepairLog -Destination $ArtifactDir -ErrorAction SilentlyContinue
          & .\Uninstall-RepairTask.ps1 *>&1 | Tee-Object -FilePath (Join-Path $ArtifactDir 'uninstall-repair-output.txt')
          Assert-True (-not (Get-ScheduledTask -TaskName $RepairTask -ErrorAction SilentlyContinue)) "Scheduled task '$RepairTask' is gone"
          Assert-True (-not (Test-Path -LiteralPath (Join-Path $StateDir 'Repair-Permissions.ps1'))) 'Repair script copy removed'
          Assert-True (Test-Path -LiteralPath $RepairLog) 'repair.log kept by default'
          Complete-Assertions

      - name: 8. Install-WeeklyCheck.ps1 (test mode)
        id: weekly_install
        if: ${{ !cancelled() }}
        run: |
          . .\tests\TestHelpers.ps1
          $testKey = 're_test_not_a_real_key_0123456789'

          # Ctrl+V in the hidden key prompt types an invisible ^V (0x16) instead of pasting.
          # Such a key must be refused, with nothing saved or registered.
          $refused = $null
          try {
              & .\Install-WeeklyCheck.ps1 -ApiKey (ConvertTo-SecureString ("re_test" + [char]0x16) -AsPlainText -Force) -OutboxPath $Outbox *> $null
          } catch { $refused = $_.Exception.Message }
          Write-Host "Installer with a ^V key: $refused"
          Assert-True ($refused -match 'control characters' -and $refused -match 'right-click') 'A key containing ^V (Ctrl+V) is refused, with the right-click advice'
          Assert-True (-not (Test-Path -LiteralPath (Join-Path $StateDir 'weekly-resend.key'))) 'Nothing saved for the refused key'
          Assert-True (-not (Get-ScheduledTask -TaskName $WeeklyTask -ErrorAction SilentlyContinue)) 'No task registered for the refused key'

          # Stray spaces and a line break around a pasted key are trimmed (checked by the decrypt test below).
          & .\Install-WeeklyCheck.ps1 -ApiKey (ConvertTo-SecureString "  $testKey`r`n" -AsPlainText -Force) -OutboxPath $Outbox *>&1 |
              Tee-Object -FilePath (Join-Path $ArtifactDir 'install-weekly-output.txt')
          $out  = Get-Content -LiteralPath (Join-Path $ArtifactDir 'install-weekly-output.txt')
          $task = Get-ScheduledTask -TaskName $WeeklyTask -ErrorAction SilentlyContinue
          Assert-True $task "Scheduled task '$WeeklyTask' is registered"
          if (-not $task) { Complete-Assertions }
          Export-ScheduledTask -TaskName $WeeklyTask | Set-Content -LiteralPath (Join-Path $ArtifactDir 'weekly-task.xml')

          $me = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          Assert-True ($task.Principal.UserId -like "*$env:USERNAME") "Task runs as the installing user (got '$($task.Principal.UserId)')"
          Assert-True ($task.Principal.RunLevel -eq 'Limited') "Task is not elevated (got '$($task.Principal.RunLevel)')"
          Assert-True ($task.Principal.LogonType -eq 'Interactive') "Task runs only while the user is logged on (got '$($task.Principal.LogonType)')"
          $weekly = $task.Triggers | Where-Object { $_.CimClass.CimClassName -eq 'MSFT_TaskWeeklyTrigger' }
          Assert-True ($weekly -and $weekly.DaysOfWeek -eq 1 -and $weekly.StartBoundary -match 'T18:00:00') "Weekly trigger on Sunday 18:00 (got days=$($weekly.DaysOfWeek) start=$($weekly.StartBoundary))"
          # A fixed UTC offset would shift the run by an hour when the clocks change.
          Assert-True ($weekly.StartBoundary -notmatch '(Z|[+-]\d{2}:\d{2})$') "Weekly trigger is 18:00 local time, no UTC offset (got $($weekly.StartBoundary))"
          $logon = $task.Triggers | Where-Object { $_.CimClass.CimClassName -eq 'MSFT_TaskLogonTrigger' }
          Assert-True ($logon -and $logon.UserId -like "*$env:USERNAME") "Logon trigger for this user, so it checks at every logon (got '$($logon.UserId)')"
          Assert-True $task.Settings.StartWhenAvailable 'Runs as soon as possible after a missed start'

          # The key: stored, encrypted (never plain text), only this user can decrypt and read it.
          $keyFile = Join-Path $StateDir 'weekly-resend.key'
          Assert-True (Test-Path -LiteralPath $keyFile) 'API key file written'
          $stored = (Get-Content -LiteralPath $keyFile -Raw).Trim()   # the file ends with a newline
          Assert-True ($stored -notmatch [regex]::Escape($testKey)) 'API key is not stored in plain text'
          $bstr = [Runtime.InteropServices.Marshal]::SecureStringToBSTR(($stored | ConvertTo-SecureString))
          $decrypted = [Runtime.InteropServices.Marshal]::PtrToStringBSTR($bstr); [Runtime.InteropServices.Marshal]::ZeroFreeBSTR($bstr)
          Assert-True ($decrypted -eq $testKey) 'API key decrypts with DPAPI for this user, without the stray spaces/line break'
          $readers = Get-OtherAccess $keyFile 'ReadData' 'S-1-5-18', 'S-1-5-32-544', $me.User.Value
          Assert-True ($readers.Count -eq 0) "Only this user, SYSTEM and Administrators can read the key file (others: $($readers -join '; '))"
          Assert-True (-not ($out -match [regex]::Escape($testKey))) 'Installer never printed the key'

          $config = Get-Content -LiteralPath (Join-Path $StateDir 'weekly-config.json') -Raw | ConvertFrom-Json
          Assert-True (@($config.to) -contains 'teddaharry@gmail.com' -and @($config.to).Count -eq 1) "Recipient is teddaharry@gmail.com (got $($config.to -join ', '))"
          Assert-True ($config.from -like '*<info@rossmackenzie.co.uk>') "Sender is info@rossmackenzie.co.uk (got $($config.from))"
          Assert-True ($config.packagesPath -eq $PackagesPath) "Packages path built in (got $($config.packagesPath))"
          foreach ($f in 'Invoke-WeeklyCheck.ps1', 'weekly-config.json') {
              $writers = Get-OtherAccess (Join-Path $StateDir $f) $WriteRights 'S-1-5-18', 'S-1-5-32-544'
              Assert-True ($writers.Count -eq 0) "Only SYSTEM and Administrators can change $f (others: $($writers -join '; '))"
          }
          Assert-True (-not ($out -match '\bWARN\b' -notmatch 'TEST MODE')) 'Installer printed no warnings apart from test mode'
          Complete-Assertions

      - name: 9. Weekly check runs (weekly, logon, streak, problems)
        if: ${{ !cancelled() && steps.weekly_install.conclusion == 'success' }}
        run: |
          . .\tests\TestHelpers.ps1
          # Earlier tests' folders may still be broken if a part 2 step failed; start clean.
          foreach ($f in $TestFolder, $RepairFolderA, $RepairFolderB, $WeeklyFolder) {
              if (Test-Path -LiteralPath $f) { Remove-Item -LiteralPath $f -Recurse -Force }
          }
          function Get-Streak { (Get-Content -LiteralPath $WeeklyState -Raw | ConvertFrom-Json).clearStreak }

          Write-Host '--- a) First run: never checked, so it is the weekly one -> all-clear email, 1 week'
          $r = Invoke-WeeklyTaskRun
          Assert-True ($r.Finished -and $r.ExitCode -eq 0) "a) task run finished with exit code 0 (got $($r.ExitCode))"
          Assert-True ($r.Log -match 'WEEKLY CLEAR\s.*\b1 week\(s\) in a row') 'a) weekly.log records WEEKLY CLEAR, 1 week'
          Assert-True ($r.Emails.Count -eq 1) "a) one email (got $($r.Emails.Count))"
          if ($r.Emails.Count) {
              $e = $r.Emails[0]
              Assert-True (@($e.email.to) -contains 'teddaharry@gmail.com') 'a) email to teddaharry@gmail.com'
              Assert-True ($e.email.from -like '*<info@rossmackenzie.co.uk>') 'a) email from info@rossmackenzie.co.uk'
              Assert-True ($e.email.subject -match 'all clear' -and $e.email.subject -match '\(1 week in a row\)') "a) subject says all clear, 1 week (got '$($e.email.subject)')"
              Assert-True ($e.keyLength -eq 're_test_not_a_real_key_0123456789'.Length) 'a) the task (running as the user) decrypted the API key'
          }

          Write-Host '--- b) Logon later that week, all clear -> logged, no email'
          $r = Invoke-WeeklyTaskRun
          Assert-True ($r.ExitCode -eq 0 -and $r.Log -match 'LOGON\s+CLEAR\s.*not sent') 'b) weekly.log records LOGON CLEAR, not sent'
          Assert-True ($r.Emails.Count -eq 0) "b) no email (got $($r.Emails.Count))"
          Assert-True ((Get-Streak) -eq 1) "b) clear-weeks count unchanged at 1 (got $(Get-Streak))"

          Write-Host '--- c) The next Sunday -> all-clear email, 2 weeks'
          Set-WeeklyLastCheckDaysAgo 8
          $r = Invoke-WeeklyTaskRun
          Assert-True ($r.Emails.Count -eq 1 -and $r.Emails[0].email.subject -match '\(2 weeks in a row\)') "c) subject says 2 weeks in a row (got '$($r.Emails.email.subject)')"

          Write-Host '--- d) A folder loses SYSTEM/Administrators, next logon -> problems email straight away'
          New-StrippedTestFolder $WeeklyFolder
          $r = Invoke-WeeklyTaskRun
          Assert-True ($r.ExitCode -eq 0 -and $r.Log -match 'LOGON\s+PROBLEMS\s.*PermissionTrap\.WeeklyTestC') 'd) weekly.log records LOGON PROBLEMS with the folder'
          Assert-True ($r.Emails.Count -eq 1) "d) one email at logon (got $($r.Emails.Count))"
          if ($r.Emails.Count) {
              $m = $r.Emails[0].email
              Assert-True ($m.subject -match '1 folder\(s\) missing SYSTEM/Administrators') "d) subject reports 1 folder (got '$($m.subject)')"
              Assert-True ($m.text -match '^The check at logon') 'd) text says it was the check at logon'
              Assert-True ($m.text -match 'PermissionTrap\.WeeklyTestC - missing SYSTEM and Administrators') 'd) text lists the folder and what is missing'
              Assert-True ($m.text -match 'Get-PermissionReport\.ps1' -and $m.text -match 'as administrator') 'd) text says to run Get-PermissionReport.ps1 elevated'
              Assert-True ($m.html -match 'PermissionTrap\.WeeklyTestC') 'd) HTML version lists the folder too'
          }
          Assert-True ((Get-Streak) -eq 0) "d) clear-weeks count reset to 0 (got $(Get-Streak))"

          Write-Host '--- e) Still broken at the following logon -> emails again'
          $r = Invoke-WeeklyTaskRun
          Assert-True ($r.Emails.Count -eq 1 -and $r.Log -match 'LOGON\s+PROBLEMS') "e) another problems email (got $($r.Emails.Count))"

          Write-Host '--- f) Still broken on Sunday -> the weekly email reports it'
          Set-WeeklyLastCheckDaysAgo 8
          $r = Invoke-WeeklyTaskRun
          Assert-True ($r.Log -match 'WEEKLY PROBLEMS') 'f) weekly.log records WEEKLY PROBLEMS'
          Assert-True ($r.Emails.Count -eq 1 -and $r.Emails[0].email.text -match '^The weekly check') "f) problems email says it was the weekly check"

          Write-Host '--- g) Fixed, next Sunday -> all clear, count starts again at 1'
          Remove-Item -LiteralPath $WeeklyFolder -Recurse -Force
          Set-WeeklyLastCheckDaysAgo 8
          $r = Invoke-WeeklyTaskRun
          Assert-True ($r.Emails.Count -eq 1 -and $r.Emails[0].email.subject -match '\(1 week in a row\)') "g) count restarted at 1 week (got '$($r.Emails.email.subject)')"

          Write-Host '--- h) A key saved by the old installer with a ^V in it -> clear error, no email'
          $keyFile = Join-Path $StateDir 'weekly-resend.key'
          $goodKey = Get-Content -LiteralPath $keyFile -Raw
          ConvertFrom-SecureString (ConvertTo-SecureString ("re_test" + [char]0x16) -AsPlainText -Force) | Set-Content -LiteralPath $keyFile -Encoding ASCII
          Set-WeeklyLastCheckDaysAgo 8
          $r = Invoke-WeeklyTaskRun
          Assert-True ($r.ExitCode -ne 0) "h) task run reports failure (exit $($r.ExitCode))"
          Assert-True ($r.Log -match 'ERROR\s.*stored Resend API key contains invisible control characters.*right-click') 'h) weekly.log explains the bad stored key and how to fix it'
          Assert-True ($r.Log -notmatch 'Resend refused') 'h) does not blame Resend for a local problem'
          Assert-True ($r.Emails.Count -eq 0) "h) no email (got $($r.Emails.Count))"
          Set-Content -LiteralPath $keyFile -Value $goodKey.Trim() -Encoding ASCII
          Complete-Assertions

      - name: 10. Set-WeeklyCheckApiKey.ps1 (change the key, send a test)
        if: ${{ !cancelled() && steps.weekly_install.conclusion == 'success' }}
        run: |
          . .\tests\TestHelpers.ps1
          $keyFile    = Join-Path $StateDir 'weekly-resend.key'
          $keyBefore  = Get-Content -LiteralPath $keyFile -Raw
          $stateBefore = Get-Content -LiteralPath $WeeklyState -Raw

          # A ^V key is refused and the stored key is left alone.
          $refused = $null
          try { & .\Set-WeeklyCheckApiKey.ps1 -ApiKey (ConvertTo-SecureString ("re_test" + [char]0x16) -AsPlainText -Force) *> $null }
          catch { $refused = $_.Exception.Message }
          Assert-True ($refused -match 'control characters' -and $refused -match 'Nothing was changed') "A ^V key is refused (got: $refused)"
          Assert-True ((Get-Content -LiteralPath $keyFile -Raw) -eq $keyBefore) 'Stored key unchanged after the refused one'

          # A new key (with a stray space) replaces the old one and a test email goes out with it.
          $newKey = 're_test_new_key_after_change_42'
          $mailBefore = @(Get-ChildItem -LiteralPath $Outbox -Filter '*.json' | ForEach-Object { $_.FullName })
          & .\Set-WeeklyCheckApiKey.ps1 -ApiKey (ConvertTo-SecureString "$newKey " -AsPlainText -Force) *>&1 |
              Tee-Object -FilePath (Join-Path $ArtifactDir 'set-key-output.txt')
          $out = Get-Content -LiteralPath (Join-Path $ArtifactDir 'set-key-output.txt')
          Assert-True ($out -match 'Check your inbox') 'Set-WeeklyCheckApiKey.ps1 reports the test email was sent'
          Assert-True (-not ($out -match [regex]::Escape($newKey))) 'The new key is never printed'

          $stored = (Get-Content -LiteralPath $keyFile -Raw).Trim()
          $bstr = [Runtime.InteropServices.Marshal]::SecureStringToBSTR(($stored | ConvertTo-SecureString))
          $decrypted = [Runtime.InteropServices.Marshal]::PtrToStringBSTR($bstr); [Runtime.InteropServices.Marshal]::ZeroFreeBSTR($bstr)
          Assert-True ($decrypted -eq $newKey) 'Stored key is now the new one (trimmed), DPAPI-encrypted for this user'
          $readers = Get-OtherAccess $keyFile 'ReadData' 'S-1-5-18', 'S-1-5-32-544', ([System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value)
          Assert-True ($readers.Count -eq 0) "Key file still readable only by this user, SYSTEM and Administrators (others: $($readers -join '; '))"

          $mails = @(Get-ChildItem -LiteralPath $Outbox -Filter '*.json' | Where-Object { $mailBefore -notcontains $_.FullName } |
              ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json })
          Assert-True ($mails.Count -eq 1) "One test email (got $($mails.Count))"
          if ($mails.Count) {
              Assert-True ($mails[0].email.subject -match 'test email') "Subject is the test email (got '$($mails[0].email.subject)')"
              Assert-True (@($mails[0].email.to) -contains 'teddaharry@gmail.com') 'Test email goes to teddaharry@gmail.com'
              Assert-True ($mails[0].keyLength -eq $newKey.Length) 'Test email used the new key'
          }
          Assert-True ((Get-Content -LiteralPath $WeeklyLog -Tail 1) -match '\bTEST\s+email') 'weekly.log records the TEST email'
          Assert-True ((Get-Content -LiteralPath $WeeklyState -Raw) -eq $stateBefore) 'The test did not count as a weekly check (state unchanged)'
          Assert-True (Get-ScheduledTask -TaskName $WeeklyTask -ErrorAction SilentlyContinue) 'Task still installed (no reinstall needed)'

          # Entering nothing keeps the stored key and still sends a test email.
          $keyNow = Get-Content -LiteralPath $keyFile -Raw
          $mailBefore = @(Get-ChildItem -LiteralPath $Outbox -Filter '*.json' | ForEach-Object { $_.FullName })
          & .\Set-WeeklyCheckApiKey.ps1 -ApiKey (New-Object System.Security.SecureString) *> $null
          Assert-True ((Get-Content -LiteralPath $keyFile -Raw) -eq $keyNow) 'Blank entry keeps the stored key'
          $mails = @(Get-ChildItem -LiteralPath $Outbox -Filter '*.json' | Where-Object { $mailBefore -notcontains $_.FullName } |
              ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json })
          Assert-True ($mails.Count -eq 1 -and $mails[0].email.subject -match 'test email' -and $mails[0].keyLength -eq $newKey.Length) "Blank entry still sends a test email with the stored key (got $($mails.Count))"
          Complete-Assertions

      - name: 11. Uninstall-WeeklyCheck.ps1
        if: ${{ !cancelled() && steps.weekly_install.conclusion == 'success' }}
        run: |
          . .\tests\TestHelpers.ps1
          & .\Uninstall-WeeklyCheck.ps1 *>&1 | Tee-Object -FilePath (Join-Path $ArtifactDir 'uninstall-weekly-output.txt')
          Assert-True (-not (Get-ScheduledTask -TaskName $WeeklyTask -ErrorAction SilentlyContinue)) "Scheduled task '$WeeklyTask' is gone"
          foreach ($f in 'weekly-resend.key', 'Invoke-WeeklyCheck.ps1', 'weekly-config.json') {
              Assert-True (-not (Test-Path -LiteralPath (Join-Path $StateDir $f))) "$f removed"
          }
          Assert-True (Test-Path -LiteralPath $WeeklyLog) 'weekly.log kept by default'
          Complete-Assertions

      - name: 12. Disable-Auditing.ps1
        if: ${{ !cancelled() && steps.enable.conclusion == 'success' }}
        run: |
          . .\tests\TestHelpers.ps1
          & .\Disable-Auditing.ps1 *>&1 | Tee-Object -FilePath (Join-Path $ArtifactDir 'disable-output.txt')
          $out    = Get-Content -LiteralPath (Join-Path $ArtifactDir 'disable-output.txt')
          $before = Get-Content -LiteralPath $BeforeFile -Raw | ConvertFrom-Json
          $after  = Get-AuditSnapshot
          $after | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $ArtifactDir 'snapshot-after.json') -Encoding UTF8

          foreach ($name in $Subcategories.Keys) {
              $guid = $Subcategories[$name]
              $was = $before.AuditSettings.$guid; $now = $after.AuditSettings.$guid
              Assert-True ($was -eq $now) "$name auditing restored (before '$was', now '$now')"
          }
          Assert-True ($before.CmdLineValue -eq $after.CmdLineValue) "ProcessCreationIncludeCmdLine_Enabled restored (before '$($before.CmdLineValue)', now '$($after.CmdLineValue)')"
          Assert-True ($before.SecurityLogMax -eq $after.SecurityLogMax) "Security log size restored (before $($before.SecurityLogMax), now $($after.SecurityLogMax))"
          Assert-True ($before.HasAuditRule -eq $after.HasAuditRule) "Packages audit rule restored (before $($before.HasAuditRule), now $($after.HasAuditRule))"
          Assert-True (-not (Test-Path -LiteralPath (Join-Path $StateDir 'audit-state.json'))) 'audit-state.json removed after a clean restore'
          Assert-True (-not ($out -match '\bWARN\b')) 'Disable-Auditing.ps1 printed no warnings'
          Complete-Assertions

      - name: Collect logs
        if: always()
        run: |
          . .\tests\TestHelpers.ps1
          if (Test-Path -LiteralPath $StateDir) { Copy-Item -LiteralPath $StateDir -Destination (Join-Path $ArtifactDir 'ProgramData-PermissionTrap') -Recurse -Force }
          & auditpol.exe /get /category:* > (Join-Path $ArtifactDir 'auditpol-final.txt')
          & wevtutil.exe epl Security (Join-Path $ArtifactDir 'security-events.evtx') '/q:*[System[(EventID=4663 or EventID=4670 or EventID=4688)]]'
          Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 4670, 4663 } -ErrorAction SilentlyContinue |
              Format-List TimeCreated, Id, Message | Out-File (Join-Path $ArtifactDir 'security-4670-4663.txt') -Width 300
          foreach ($f in $TestFolder, $RepairFolderA, $RepairFolderB, $WeeklyFolder) {
              if (-not (Test-Path -LiteralPath $f)) { continue }
              & icacls.exe $f > (Join-Path $ArtifactDir "$(Split-Path $f -Leaf)-acl-final.txt")
              Remove-Item -LiteralPath $f -Recurse -Force -ErrorAction SilentlyContinue
          }
          Get-WinEvent -LogName 'Microsoft-Windows-TaskScheduler/Operational' -MaxEvents 200 -ErrorAction SilentlyContinue |
              Format-List TimeCreated, Id, Message | Out-File (Join-Path $ArtifactDir 'taskscheduler-events.txt') -Width 300
          exit 0   # best effort: a failed export must not fail the job

      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/part1-artifacts
          if-no-files-found: warn
